server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: hotel-reservations
  autoconfigure:
    # Accounts live in our own UserRepository; this removes Spring's generated default user.
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: false

hotel:
  high-season-months: 6,7,12,1
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  security:
    jwt:
      # Required. Provide a random string of at least 32 characters, e.g. `openssl rand -base64 48`.
      secret: ${JWT_SECRET:}
      issuer: hotel-reservations
      access-token-ttl: 15m
      refresh-token-ttl: 7d
    admin:
      email: ${ADMIN_EMAIL:}
      password: ${ADMIN_PASSWORD:}
