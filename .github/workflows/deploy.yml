name: Test and deploy backend

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "deploy/aws/setup-github-deploy.sh"
  workflow_dispatch:

# Never run two deployments at the same time.
concurrency:
  group: deploy-backend
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Run tests
        run: mvn -B test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write # lets the job request the OIDC token used to assume the AWS role
      contents: read
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      IMAGE_NAME: hotel-reservations
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC, no stored keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push the image
        run: |
          IMAGE="${{ steps.ecr.outputs.registry }}/$IMAGE_NAME"
          docker build -t "$IMAGE:latest" -t "$IMAGE:${GITHUB_SHA}" .
          docker push "$IMAGE:latest"
          docker push "$IMAGE:${GITHUB_SHA}"

      - name: Restart the container on EC2
        run: |
          INSTANCE_ID="$(aws ec2 describe-instances \
            --filters Name=tag:Name,Values=hotel-reservations Name=instance-state-name,Values=running \
            --query 'Reservations[0].Instances[0].InstanceId' --output text)"
          COMMAND_ID="$(aws ssm send-command --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters 'commands=["/usr/local/bin/hotel-start"]' \
            --query Command.CommandId --output text)"
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID"
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query Status --output text

      - name: Wait until the API answers
        run: |
          for attempt in $(seq 1 30); do
            code="$(curl -s -o /dev/null -w '%{http_code}' -m 10 -X POST "${{ vars.SITE_URL }}/api/v1/auth/login" \
              -H 'Content-Type: application/json' -d '{"email":"health@check.invalid","password":"x"}')"
            echo "attempt $attempt: HTTP $code"
            # 401 means the application is up and rejecting the fake credentials.
            if [ "$code" = "401" ]; then exit 0; fi
            sleep 10
          done
          echo "The API did not become healthy in time" >&2
          exit 1
